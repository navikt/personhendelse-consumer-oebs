apiVersion: nais.io/v1alpha1
kind: Application

metadata:
  name: personhendelse-consumer-dependabot
  namespace: team-oebs
  labels:
    team: team-oebs

spec:
  image: {{ image }}
  port: 8080

  env:
    - name: SPRING_PROFILES_ACTIVE
      value: dependabot

  ttl: 6m

  envFrom:
    - secret: dependabot-oebs-t1
    - secret: personhendelse-consumer-dependabot-oracle

  replicas:
    min: 1
    max: 1
    cpuThresholdPercentage: 50
  liveness:
    path: /internal/isalive
    initialDelay: 60
    timeout: 10
  readiness:
    path: /internal/isready
    initialDelay: 60
    timeout: 10

  resources:
    limits:
      memory: 768Mi
    requests:
      cpu: 200m
      memory: 512Mi
  prometheus:
    enabled: true
    path: /actuator/prometheus
  kafka:
    pool: nav-dev

  azure:
    application:
      enabled: true
      tenant: trygdeetaten.no

  accessPolicy:
    inbound:
      rules: [ ]
    outbound:
      external: [ ]
